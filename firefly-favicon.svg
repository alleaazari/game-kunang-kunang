<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Outer glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#FFFF00" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#AAFF00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00FF00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bodyGlow" cx="50%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#FFFF44"/>
      <stop offset="100%" stop-color="#88CC00"/>
    </radialGradient>
  </defs>
  <!-- Background glow circle -->
  <circle cx="32" cy="38" r="28" fill="url(#glow)"/>
  <!-- Left wing -->
  <ellipse cx="22" cy="26" rx="10" ry="6" fill="#ffffff" fill-opacity="0.35" transform="rotate(-25 22 26)"/>
  <!-- Right wing -->
  <ellipse cx="42" cy="26" rx="10" ry="6" fill="#ffffff" fill-opacity="0.35" transform="rotate(25 42 26)"/>
  <!-- Body (dark top) -->
  <ellipse cx="32" cy="28" rx="5" ry="7" fill="#2a1a0a"/>
  <!-- Glowing abdomen -->
  <ellipse cx="32" cy="40" rx="6" ry="9" fill="url(#bodyGlow)"/>
  <!-- Head -->
  <circle cx="32" cy="20" r="4" fill="#3a2a1a"/>
  <!-- Eyes -->
  <circle cx="30" cy="19" r="1.2" fill="#ffffff"/>
  <circle cx="34" cy="19" r="1.2" fill="#ffffff"/>
  <!-- Antennae -->
  <line x1="30" y1="16" x2="26" y2="10" stroke="#3a2a1a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="34" y1="16" x2="38" y2="10" stroke="#3a2a1a" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="26" cy="10" r="1.5" fill="#AAFF00"/>
  <circle cx="38" cy="10" r="1.5" fill="#AAFF00"/>
</svg>
